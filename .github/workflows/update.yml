name: Auto Update Hackathons

# Scheduling moved to Vercel Cron (see `crons` in vercel.json). GitHub
# Actions was dropping most scheduled runs: the uptime check declares
# `*/15 * * * *` (96/day) and actually fired 7 times in 24h, and this
# workflow's own weekday slots never fired at all. Vercel invokes the
# deployment directly, so there is no APP_URL indirection and no CRON_SECRET
# round trip.
#
# Kept as a manual escape hatch - `gh workflow run update.yml`, or the Run
# workflow button - for triggering a run on demand without waiting for the
# daily cron.
on:
  workflow_dispatch:

jobs:
  update-hackathons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Trigger update endpoint
        id: update
        run: |
          echo "🚀 Triggering update endpoint..."

          if [ -z "$APP_URL" ]; then
            echo "Repository variable APP_URL is not configured"
            exit 1
          fi

          response=$(curl -s -w "%{http_code}" -o response.json \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${APP_URL%/}/api/update" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "📊 HTTP Status: $response"

          if [ -f response.json ]; then
            echo "📄 Response:"
            cat response.json
          else
            echo "⚠️ No response file generated"
          fi

          if [ "$response" -eq 200 ]; then
            echo "✅ Update completed successfully"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Update failed with status $response"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload response artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-response-${{ github.run_number }}
          path: response.json
          retention-days: 7
