name: Auto Update Hackathons

on:
  schedule:
    # Una chiamata al giorno (invece delle precedenti 3-5/giorno): gli
    # hackathon si annunciano con settimane di anticipo, quindi una scansione
    # giornaliera non perde praticamente nulla in freschezza dei dati, e
    # riduce il volume di richieste verso l'endpoint pubblico e non
    # autenticato di Luma (issue #33 - rivalutare la frequenza).
    - cron: "0 8 * * *" # 10:00 CET
  workflow_dispatch:

jobs:
  update-hackathons:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger update endpoint
        id: update
        run: |
          echo "🚀 Triggering update endpoint..."

          # APP_URL must be set as a repository variable (Settings > Secrets
          # and variables > Actions > Variables) pointing at YOUR OWN
          # deployment. This previously hardcoded the original upstream
          # project's Vercel URL, which this fork has no access to (see
          # CLAUDE.md) - forks must deploy their own instance and set this.
          APP_URL="${{ vars.APP_URL }}"

          if [ -z "$APP_URL" ]; then
            echo "❌ APP_URL repository variable is not set - see .github/workflows/update.yml"
            exit 1
          fi

          response=$(curl -s -w "%{http_code}" -o response.json \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${APP_URL%/}/api/update" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "📊 HTTP Status: $response"

          if [ -f response.json ]; then
            echo "📄 Response:"
            cat response.json
          else
            echo "⚠️ No response file generated"
          fi

          if [ "$response" -eq 200 ]; then
            echo "✅ Update completed successfully"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Update failed with status $response"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload response artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-response-${{ github.run_number }}
          path: response.json
          retention-days: 7
